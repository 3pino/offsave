[package]
name = "offsave-app"
version = "0.3.1"
description = "offsave client"
edition = "2021"
publish = false

# ワークスペース（ルートの Cargo.toml）からは除外している。webkit2gtk などが必要なので単独でビルドする
[workspace]

[lib]
name = "offsave_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: 配布版でも、Ctrl+Shift+I（F12）で開発者ツールを開けるようにする
tauri = { version = "2", features = ["devtools"] }
# 外部リンクを、OS の既定のブラウザーで開く
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 単一インスタンス（デスクトップだけ）。2 つ目の起動は、既存のウィンドウを出す
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# アプリ自身の更新（デスクトップ）。Android は apk-updater で APK を取って入れる
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-enforcer = { path = "plugins/enforcer" }
tauri-plugin-apk-updater = { path = "plugins/apk-updater" }
