[package]
name = "offsave-server"
version.workspace = true
edition.workspace = true

[dependencies]
offsave-core = { path = "../core" }
axum = { version = "0.8", features = ["ws", "macros"] }
futures-util = "0.3"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = "0.2"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"

# 結合テスト用の開発モードのサーバー（src/testing.rs）。本番には入らない
tempfile = { version = "3", optional = true }

[features]
test-support = ["dep:tempfile"]

[dev-dependencies]
offsave-server = { path = ".", features = ["test-support"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
tempfile = "3"
