# タグ（v0.2.0 など）を push すると、全プラットフォームをビルドして GitHub Releases に公開する。
# タグのバージョンは app/src-tauri/tauri.conf.json の version と一致させること（`scripts/bump-version.sh` で揃える）。
#
# 署名（GitHub の Secrets）:
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD … デスクトップの自動更新の署名（アプリに公開鍵が入っている）
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD … Android の APK の署名（同じ鍵でないと、アップデートとして入らない）
# 鍵は手元の ~/.config/offsave-keys/ にある。失うと、自動更新と APK の更新ができなくなる（入れ直しになる）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: タグと tauri.conf.json のバージョンを照合
        run: |
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::タグ $TAG と tauri.conf.json の version ($VERSION) が一致しません"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: create
        name: 下書きのリリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 下書きはタグで検索できないことがあるので、作成時のレスポンスから ID を受け取る
          ID=$(gh api -X POST repos/${{ github.repository }}/releases \
            -f tag_name="$TAG" -f name="offsave $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$ID" ]; then
            echo "::error::リリースの作成に失敗しました"
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # AppImage を古い glibc の環境でも動かすため、Linux は古めの Ubuntu でビルドする
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: release-desktop
      - name: Linux の依存ライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          updaterJsonPreferNsis: true
          # latest.json は各ジョブでは書かず、publish でまとめて作る（並列にできる）
          uploadUpdaterJson: false

  android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: release-android
      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: 署名の鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.jks"
          echo "OFFSAVE_KEYSTORE=$RUNNER_TEMP/android.jks" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - name: APK をビルド（リリース署名）
        working-directory: app
        env:
          OFFSAVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npx tauri android build --apk --target aarch64
      - name: 署名を確かめる
        run: |
          APK=app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -3
      - name: リリースに追加
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          APK="offsave_${VERSION}_android-arm64.apk"
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          gh release upload "$TAG" "$APK" --repo ${{ github.repository }}

  # サーバー。本番（Ubuntu 24.04）と glibc の版を合わせるため、ubuntu-24.04 でビルドする。
  # サーバーの自動更新（OFFSAVE_AUTO_UPDATE=1）は、この資産と sha256 を取る。
  server:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-server
      - run: cargo build --release --locked -p offsave-server
      - name: リリースに添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=offsave-server_linux-x64
          cp target/release/offsave-server "$ASSET"
          # 想定の版を名乗るか（自動更新も同じ確認をする）
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          test "$(./$ASSET --version)" = "offsave-server $VERSION"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo ${{ github.repository }}

  publish:
    needs: [create-release, desktop, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: latest.json を作って添付する（各デスクトップのジョブの .sig から）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          scripts/release-latest-json.sh "$TAG" "$VERSION" "${{ github.repository }}"
          gh release upload "$TAG" latest.json --clobber --repo ${{ github.repository }}
      - name: リリースを公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo ${{ github.repository }} --draft=false --latest
