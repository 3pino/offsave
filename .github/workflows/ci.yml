# push・PR のたびに、試験とビルドが通るかを確かめる（成果物は配らない）。リリースは release.yml（タグ v*）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust（判定ロジック・サーバー）の試験と、画面の型検査・試験
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-typos.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app

  # Android（実機向けの arm64。デバッグ署名）。Kotlin の試験も実行する
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/src-tauri/gen/android/**/*.gradle*', 'app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'app/src-tauri/plugins/**/*.kts', 'app/src-tauri/plugins/gradle-versions.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - name: APK をビルド（デバッグ）
        run: npx tauri android build --debug --target aarch64 --apk
        working-directory: app
      - name: Kotlin の試験（Rust と共通の試験データを使う）
        run: ./gradlew :tauri-plugin-enforcer:testDebugUnitTest :tauri-plugin-apk-updater:testDebugUnitTest
        working-directory: app/src-tauri/gen/android

  # デスクトップ版がビルドできるか（署名つきの配布物は release.yml）
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux の依存パッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libsoup-3.0-dev patchelf
      - run: npm ci
        working-directory: app
      # 署名の鍵（Secrets）が要らないよう、バンドルは作らない
      - run: npx tauri build --no-bundle
        working-directory: app
