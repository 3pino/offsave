name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust（判定ロジック・サーバー）の試験と、画面の型検査
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app

  # サーバー（Linux）
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p offsave-server
      - uses: actions/upload-artifact@v7
        with:
          name: offsave-server-linux-x86_64
          path: target/release/offsave-server
          if-no-files-found: error

  # Android（実機向けの arm64。デバッグ署名）。Kotlin の試験も実行する
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/src-tauri/gen/android/**/*.gradle*', 'app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'app/src-tauri/plugins/**/*.kts', 'app/src-tauri/plugins/gradle-versions.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - name: APK をビルド
        run: npx tauri android build --debug --target aarch64 --apk
        working-directory: app
      - name: Kotlin の試験（Rust と共通の試験データを使う）
        run: ./gradlew :tauri-plugin-enforcer:testDebugUnitTest
        working-directory: app/src-tauri/gen/android
      - name: APK を整える
        run: |
          mkdir -p dist
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/offsave-android-arm64-debug.apk
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: offsave-android-arm64-debug
          path: dist/offsave-android-arm64-debug.apk
          if-no-files-found: error

  # デスクトップ版（いまは、友達の状況を見るダッシュボード）
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
            artifact: offsave-desktop-linux
            glob: app/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: offsave-desktop-windows
            glob: app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux の依存パッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libsoup-3.0-dev patchelf
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # タグ（v*）を push したときだけ、成果物を GitHub Release に載せる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, server, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp artifacts/offsave-android-arm64-debug/*.apk dist/
          cp artifacts/offsave-server-linux-x86_64/offsave-server dist/offsave-server-linux-x86_64
          cp artifacts/offsave-desktop-linux/*.deb dist/
          cp artifacts/offsave-desktop-windows/*.exe dist/
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --prerelease --generate-notes \
            --notes "Android の APK はデバッグ署名です。入れ替えるときは、先にアンインストールが必要です。既知の限界は README を参照してください。"
